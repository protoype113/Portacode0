<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">


   <!-- Bootstrap CSS -->
   <link rel="stylesheet"
         href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
         integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
         crossorigin="anonymous">

    <link rel="stylesheet" href="Instructor_content/instructorSite.css">
    <link rel="stylesheet" href="mouseModify.css">

   <title>Kickoff Project Site</title>
</head>


<body class="w-100" style="margin:24px;">

    <h1>Project Voting</h1>
    <h2>by Instructors</h2>
   
   <hr>

   <!-- Voting  -->
   <div class="container">
       <h3 class="mb-2">Vote for your favorite project:</h3>
       <div class="row">
           <!-- Upcoming projects with Vote buttons -->
           <div class="col-md-6 mb-4">
               <h5>Projects</h5>
               <ul id="projectList" class="list-group"></ul>
               <small class="text-muted d-block mt-2">Click <b>Vote</b> to cast your vote.</small>
           </div>

           <!-- Results (live) -->
           <div class="col-md-6 mb-4">
               <h5>Results Tally</h5>
               <div id="results" aria-live="polite"></div>
               <button id="resetVotes" type="button" class="btn btn-sm btn-outline-secondary mt-2">
                   Reset (dev)
               </button>
           </div>
       </div>
   </div>


   <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
           integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
           crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
           integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
           crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
           integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
           crossorigin="anonymous"></script>


   <script src="Instructor_content/script.js"></script>


   <!-- Page bootstrap -->
   <script>
       $(document).ready(function () {
           initializeVoteGrid();
       });
   </script>
</body>
</html>
