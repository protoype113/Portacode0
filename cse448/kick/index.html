<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">

    <title>Kickoff Project Site</title>
</head>

<body class="w-100" style="margin:24px;">

    <h1>Sr. Design Kickoff Project</h1>
    <p class="text-muted mb-1">Simple client-side voting (no database). Votes update live.</p>
    <button onclick="goToNewPage('TeamPages/Instructor_content/instructions.html')" id="btnInstructions" style="margin:1em;">Get Instructions</button>
    <hr>

    <!-- Team Cards Render Here -->
    <div class="container w-100 mb-4">
        <h3 class="mb-2">Teams</h3>
        <div class="container d-flex flex-wrap" id="displayTeams"></div>
    </div>

    <hr>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
            integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
            integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
            crossorigin="anonymous"></script>

    <script src="site.js"></script>

    <!-- Page bootstrap -->
    <script>
        // Renders team cards with links (UC-1)
        const showTeams = () => {
            const data = getTeams();
            let output = ``;
            // for each team in the site.js/getTeams json, generate the card html
            $.each(data, function (key, value) {
                output += `<div class="card" style="width:15rem;margin:20px 20px 20px 0px">`;
                output += `<div class="card-header bg-info text-white"><b>${value.team_name}</b></div>`;
                output += `<div class="card-body"><ul class="mb-2">`;
                $.each(value.team_members, function (_, person) {
                    output += `<li>${person.first_name} ${person.last_name}</li>`;
                });
                output += `</ul>`;
                output += `<a href="${value.page_url}">Team Page</a></div>`;
                output += `</div>`;
            });
            $('#displayTeams').html(output);  // send the cards to the div with id=displayeams
        };

        $(document).ready(function () {
            showTeams();
        });
    </script>
</body>
</html>
